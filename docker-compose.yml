services:
  balance-monitor:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3000:8000"
    environment:
      DATABASE_PATH: /data/balance-monitor.db
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-300}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
    volumes:
      - balance_data:/data
    restart: unless-stopped

volumes:
  balance_data:
